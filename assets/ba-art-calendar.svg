<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 780" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5CFFB0"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g stroke="#5CFFB0" stroke-opacity=".07" stroke-width="1">
    <path d="M80 80 H900 M80 180 H900 M80 280 H900 M80 380 H900 M80 480 H900 M80 580 H900 M80 680 H900"/>
    <path d="M80 80 V700 M220 80 V700 M360 80 V700 M500 80 V700 M640 80 V700 M780 80 V700 M900 80 V700"/>
  </g>
  <g stroke="#5CFFB0" stroke-opacity=".3" stroke-width="1.5">
    <path d="M60 60 H140 M60 60 V140"/><path d="M920 60 H840 M920 60 V140"/>
    <path d="M60 720 H140 M60 720 V640"/><path d="M920 720 H840 M920 720 V640"/>
  </g>
  
  <rect x="200" y="160" width="580" height="460" rx="24" fill="#121a2b" stroke="#5CFFB0" stroke-width="2.5" filter="url(#glow)"/>
  <rect x="200" y="160" width="580" height="70" rx="24" fill="#0f8f97" opacity=".55"/>
  <text x="420" y="205" fill="#e8eef5" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="800">90 days</text>
  <g fill="#5CFFB0" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">
    <text x="240" y="280">M</text><text x="320" y="280">T</text><text x="400" y="280">W</text><text x="480" y="280">T</text><text x="560" y="280">F</text><text x="640" y="280">S</text><text x="720" y="280">S</text>
  </g>
  <g>
    <!-- week chips -->
    <rect x="230" y="320" width="60" height="48" rx="10" fill="#0f8f97" opacity=".5"/>
    <rect x="310" y="320" width="60" height="48" rx="10" fill="#1f8fc9" opacity=".45"/>
    <rect x="390" y="320" width="60" height="48" rx="10" fill="#74b816" opacity=".4"/>
    <rect x="470" y="320" width="60" height="48" rx="10" fill="#4c6ef5" opacity=".4"/>
    <rect x="550" y="320" width="60" height="48" rx="10" fill="#9775fa" opacity=".35"/>
    <rect x="230" y="390" width="300" height="48" rx="10" fill="#0f8f97" opacity=".35"/>
    <rect x="230" y="460" width="420" height="48" rx="10" fill="#1f8fc9" opacity=".3"/>
    <rect x="230" y="530" width="500" height="48" rx="10" fill="#74b816" opacity=".28"/>
  </g>
  <rect x="310" y="320" width="60" height="48" rx="10" fill="none" stroke="#5CFFB0" stroke-width="2">
    <animate attributeName="opacity" values="1;.3;1" dur="2s" repeatCount="indefinite"/>
  </rect>
  <text x="250" y="660" fill="#9aa8bc" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="600">Mon numbers · warm outreach · proof · close</text>

</svg>
