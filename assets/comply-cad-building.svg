      <path d="M440 230 H515 M440 280 H515 M440 330 H510 M440 380 H505 M440 430 H500 M440 480 H495 M440 530 H490" stroke-width="1.2" stroke-opacity=".55"/>
      <!-- crane -->
      <path d="M420 70 L420 18" stroke-width="2.2"/>
      <path d="M340 32 H530" stroke-width="2.2"/>
      <path d="M530 32 L515 48 M530 32 L545 48" stroke-width="2"/>
      <path d="M470 32 L470 85" stroke-width="1.5" stroke-opacity=".75"/>
      <path d="M390 32 L390 95" stroke-width="1.3" stroke-opacity=".55"/>
    </g>

    <!-- right mid tower -->
    <g stroke-width="2" stroke-opacity=".92">
      <path d="M500 600 L500 250 L590 205 L680 250 L680 600 L590 645 Z"/>
      <path d="M500 250 L590 295 L680 250"/>
      <path d="M590 295 L590 645"/>
      <path d="M515 285 L590 325 L665 285" stroke-width="1.5" stroke-opacity=".75"/>
      <path d="M515 335 L590 375 L665 335" stroke-width="1.5" stroke-opacity=".7"/>
      <path d="M515 385 L590 425 L665 385" stroke-width="1.5" stroke-opacity=".65"/>
      <path d="M515 435 L590 475 L665 435" stroke-width="1.5" stroke-opacity=".6"/>
      <path d="M515 485 L590 525 L665 485" stroke-width="1.5" stroke-opacity=".55"/>
      <path d="M530 300 V560 M560 315 V575 M620 315 V575 M650 300 V560" stroke-width="1.3" stroke-opacity=".65"/>
    </g>

    <!-- front low podium / site building -->
    <g stroke-width="2.1" stroke-opacity=".95">
      <path d="M210 600 L210 470 L320 430 L430 470 L430 600 L320 640 Z"/>
      <path d="M210 470 L320 510 L430 470"/>
      <path d="M320 510 L320 640"/>
      <path d="M230 490 V585 M260 502 V597 M280 510 V605" stroke-width="1.3" stroke-opacity=".7"/>
      <path d="M360 502 V597 M390 490 V585 M410 482 V577" stroke-width="1.3" stroke-opacity=".65"/>
      <path d="M230 520 H300 M230 555 H305" stroke-width="1.2" stroke-opacity=".6"/>
      <path d="M340 520 H410 M340 555 H405" stroke-width="1.2" stroke-opacity=".55"/>
    </g>

    <!-- small right annex -->
    <g stroke-width="1.9" stroke-opacity=".88">
      <path d="M560 600 L560 480 L620 450 L680 480 L680 600 L620 630 Z"/>
      <path d="M560 480 L620 510 L680 480"/>
      <path d="M620 510 L620 630"/>
      <path d="M575 500 V585 M600 512 V597 M640 512 V597 M665 500 V585" stroke-width="1.2" stroke-opacity=".65"/>
    </g>
  </g>

  <!-- dimension marks -->
  <g stroke="#7CFFC8" stroke-opacity=".55" stroke-width="1.4">
    <path d="M28 360 V600 M18 360 H38 M18 600 H38"/>
    <path d="M300 700 H540 M300 690 V710 M540 690 V710"/>
  </g>
  <text x="14" y="490" fill="#7CFFC8" fill-opacity=".7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" transform="rotate(-90 14 490)">ELEVATION</text>
  <text x="360" y="735" fill="#7CFFC8" fill-opacity=".65" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" text-anchor="middle">CAD · CONSTRUCTION DRAWING</text>
  <text x="360" y="755" fill="#5CFFB0" fill-opacity=".45" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" text-anchor="middle">SCALE 1:200</text>

  <rect width="720" height="780" fill="url(#fade)"/>
</svg>
