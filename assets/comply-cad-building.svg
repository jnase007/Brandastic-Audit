<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 780" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="gNeon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5CFFB0"/>
      <stop offset="50%" stop-color="#00E6A0"/>
      <stop offset="100%" stop-color="#2BFF88"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1419" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0f1419" stop-opacity=".2"/>
    </linearGradient>
    <filter id="glow" x="-12%" y="-12%" width="124%" height="124%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="stage"><rect x="0" y="50" width="980" height="680"/></clipPath>
    <style><![CDATA[
      .grid { opacity: .2; animation: gridScroll 22s linear infinite; }
      .skyline { animation: panDrift 16s ease-in-out infinite alternate; transform-origin: 700px 400px; }
      .draw {
        stroke-dasharray: 1000;
        stroke-dashoffset: 1000;
        animation: drawIn 2.8s ease forwards, dashFlow 9s linear 2.8s infinite;
      }
      .draw-win {
        stroke-dasharray: 320;
        stroke-dashoffset: 320;
        animation: drawIn 2.2s ease .35s forwards, dashFlow 7s linear 2.6s infinite;
      }
      .crane { transform-origin: 700px 24px; animation: craneSway 6s ease-in-out infinite alternate; }
      .scan { animation: scanY 7s ease-in-out infinite; }
      @keyframes drawIn { to { stroke-dashoffset: 0; } }
      @keyframes dashFlow { to { stroke-dashoffset: -200; } }
      @keyframes panDrift {
        0% { transform: translate(0, 4px); }
        100% { transform: translate(16px, -8px); }
      }
      @keyframes gridScroll {
        from { transform: translateY(0); }
        to { transform: translateY(-22px); }
      }
      @keyframes craneSway {
        from { transform: rotate(-1.2deg); }
        to { transform: rotate(1.4deg); }
      }
      @keyframes scanY {
        0% { transform: translateY(-30px); opacity: 0; }
        20% { opacity: .4; }
        80% { opacity: .35; }
        100% { transform: translateY(380px); opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .grid,.skyline,.draw,.draw-win,.crane,.scan { animation: none !important; stroke-dashoffset: 0 !important; }
      }
    ]]></style>
  </defs>

  <g clip-path="url(#stage)">
    <!-- sparse ground -->
    <g class="grid" stroke="#5CFFB0" stroke-width="1.15">
      <path d="M60 620 H920"/>
      <path d="M120 650 H860"/>
      <path d="M180 680 H800"/>
      <path d="M200 590 L110 710 M360 590 L280 710 M520 590 L450 710 M680 590 L620 710 M840 590 L790 710"/>
    </g>

    <g class="scan" stroke="#7CFFC8" stroke-opacity=".4" stroke-width="1.4">
      <path d="M120 140 H900"/>
    </g>

    <g class="skyline" filter="url(#glow)" stroke="url(#gNeon)" stroke-linejoin="round" stroke-linecap="round">

      <!-- left low building -->
      <g stroke-width="2.2" stroke-opacity=".9">
        <path class="draw" d="M120 600 L120 360 L210 310 L300 360 L300 600 L210 650 Z"/>
        <path class="draw" d="M120 360 L210 410 L300 360 M210 410 L210 650"/>
        <path class="draw-win" d="M150 430 V560 M180 445 V575 M240 445 V575 M270 430 V560" stroke-width="1.35" stroke-opacity=".65"/>
        <path class="draw-win" d="M150 470 H200 M150 520 H200 M230 470 H280 M230 520 H280" stroke-width="1.2" stroke-opacity=".55"/>
      </g>

      <!-- center tall -->
      <g stroke-width="2.5">
        <path class="draw" d="M360 600 L360 140 L520 70 L680 140 L680 600 L520 670 Z"/>
        <path class="draw" d="M360 140 L520 210 L680 140 M520 210 L520 670"/>
        <!-- only a few floors -->
        <path class="draw-win" d="M390 230 L520 290 L650 230 M390 340 L520 400 L650 340 M390 450 L520 510 L650 450" stroke-width="1.7" stroke-opacity=".72"/>
        <!-- sparse windows -->
        <path class="draw-win" d="M420 250 V540 M470 270 V560 M570 270 V560 M620 250 V540" stroke-width="1.4" stroke-opacity=".62"/>
        <g class="crane">
          <path d="M520 70 L520 18 M430 30 H640 M640 30 L622 48 M640 30 L658 48 M560 30 L560 95" stroke-width="2.1"/>
        </g>
      </g>

      <!-- right tower -->
      <g stroke-width="2.2" stroke-opacity=".92">
        <path class="draw" d="M720 600 L720 250 L820 200 L920 250 L920 600 L820 650 Z"/>
        <path class="draw" d="M720 250 L820 300 L920 250 M820 300 L820 650"/>
        <path class="draw-win" d="M750 310 L820 355 L890 310 M750 400 L820 445 L890 400 M750 490 L820 535 L890 490" stroke-width="1.55" stroke-opacity=".68"/>
        <path class="draw-win" d="M760 330 V560 M800 350 V575 M850 350 V575 M890 330 V560" stroke-width="1.3" stroke-opacity=".6"/>
      </g>

      <!-- small front podium -->
      <g stroke-width="2.1" stroke-opacity=".9">
        <path class="draw" d="M480 600 L480 470 L580 430 L680 470 L680 600 L580 640 Z"/>
        <path class="draw" d="M480 470 L580 510 L680 470 M580 510 L580 640"/>
        <path class="draw-win" d="M510 500 V575 M550 515 V590 M610 515 V590 M650 500 V575" stroke-width="1.25" stroke-opacity=".6"/>
      </g>
    </g>
  </g>

  <g stroke="#7CFFC8" stroke-opacity=".45" stroke-width="1.3">
    <path d="M55 360 V600 M45 360 H65 M45 600 H65"/>
  </g>
  <text x="30" y="490" fill="#7CFFC8" fill-opacity=".65" font-family="ui-monospace, Menlo, monospace" font-size="12" transform="rotate(-90 30 490)">ELEVATION</text>
  <text x="700" y="740" fill="#7CFFC8" fill-opacity=".6" font-family="ui-monospace, Menlo, monospace" font-size="12" text-anchor="middle">CAD · DRAWING</text>
  <rect width="980" height="780" fill="url(#fade)"/>
</svg>
