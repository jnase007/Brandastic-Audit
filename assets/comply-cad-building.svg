<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 780" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="gNeon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5CFFB0"/>
      <stop offset="45%" stop-color="#00E6A0"/>
      <stop offset="100%" stop-color="#2BFF88"/>
    </linearGradient>
    <linearGradient id="gMid" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#00D4AA" stop-opacity=".95"/>
      <stop offset="100%" stop-color="#7CFFC8" stop-opacity=".85"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1419" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0f1419" stop-opacity=".25"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ground grid - greener -->
  <g stroke="#5CFFB0" stroke-opacity=".28" stroke-width="1.2">
    <path d="M30 600 H690"/>
    <path d="M60 620 H660"/>
    <path d="M100 640 H620"/>
    <path d="M140 660 H580"/>
    <path d="M180 680 H540"/>
    <path d="M160 580 L70 700 M240 580 L150 700 M320 580 L240 700 M400 580 L330 700 M480 580 L420 700 M560 580 L510 700 M640 580 L600 700"/>
  </g>

  <g filter="url(#glow)" stroke="url(#gNeon)" stroke-linejoin="round" stroke-linecap="round">

    <!-- far left tower -->
    <g stroke-width="2" stroke-opacity=".9">
      <path d="M48 600 L48 360 L110 330 L172 360 L172 600 L110 630 Z"/>
      <path d="M48 360 L110 390 L172 360"/>
      <path d="M110 390 L110 630"/>
      <path d="M62 400 V580 M88 412 V592 M130 412 V592 M152 400 V580" stroke-width="1.3" stroke-opacity=".7"/>
      <path d="M62 430 H100 M62 470 H100 M62 510 H100 M62 550 H100" stroke-width="1.2" stroke-opacity=".65"/>
      <path d="M120 430 H160 M120 470 H160 M120 510 H160 M120 550 H160" stroke-width="1.2" stroke-opacity=".65"/>
    </g>

    <!-- mid-left slab -->
    <g stroke-width="2.1" stroke-opacity=".95">
      <path d="M150 600 L150 280 L250 230 L350 280 L350 600 L250 650 Z"/>
      <path d="M150 280 L250 330 L350 280"/>
      <path d="M250 330 L250 650"/>
      <!-- floors -->
      <path d="M165 320 L250 365 L335 320" stroke-width="1.5" stroke-opacity=".8"/>
      <path d="M165 370 L250 415 L335 370" stroke-width="1.5" stroke-opacity=".75"/>
      <path d="M165 420 L250 465 L335 420" stroke-width="1.5" stroke-opacity=".7"/>
      <path d="M165 470 L250 515 L335 470" stroke-width="1.5" stroke-opacity=".65"/>
      <path d="M165 520 L250 565 L335 520" stroke-width="1.5" stroke-opacity=".6"/>
      <!-- windows -->
      <path d="M180 340 V560 M210 355 V575 M280 355 V575 M310 340 V560" stroke-width="1.3" stroke-opacity=".65"/>
    </g>

    <!-- MAIN center tower (tallest) -->
    <g stroke-width="2.4">
      <path d="M300 600 L300 140 L420 70 L540 140 L540 600 L420 670 Z"/>
      <path d="M300 140 L420 210 L540 140"/>
      <path d="M420 210 L420 670"/>
      <!-- floors -->
      <path d="M318 185 L420 245 L522 185" stroke-width="1.7" stroke-opacity=".85"/>
      <path d="M318 240 L420 300 L522 240" stroke-width="1.7" stroke-opacity=".8"/>
      <path d="M318 295 L420 355 L522 295" stroke-width="1.7" stroke-opacity=".75"/>
      <path d="M318 350 L420 410 L522 350" stroke-width="1.7" stroke-opacity=".7"/>
      <path d="M318 405 L420 465 L522 405" stroke-width="1.7" stroke-opacity=".65"/>
      <path d="M318 460 L420 520 L522 460" stroke-width="1.7" stroke-opacity=".6"/>
      <path d="M318 515 L420 575 L522 515" stroke-width="1.7" stroke-opacity=".55"/>
