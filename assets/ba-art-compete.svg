    <path d="M60 720 H140 M60 720 V640"/><path d="M920 720 H840 M920 720 V640"/>
  </g>
  
  <g filter="url(#glow)" stroke="url(#g)" stroke-width="3" fill="none">
    <circle cx="520" cy="390" r="70"/>
    <circle cx="520" cy="390" r="130" opacity=".7"/>
    <circle cx="520" cy="390" r="190" opacity=".4"/>
  </g>
