    <circle cx="400" cy="300" r="10"><animate attributeName="r" values="8;12;8" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="300" r="10"><animate attributeName="r" values="8;12;8" dur="2.4s" begin=".3s" repeatCount="indefinite"/></circle>
    <circle cx="360" cy="470" r="9"><animate attributeName="r" values="7;11;7" dur="2.6s" begin=".5s" repeatCount="indefinite"/></circle>
