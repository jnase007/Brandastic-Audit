    <circle cx="520" cy="220" r="9"/>
  </g>
  <g stroke="#5CFFB0" stroke-opacity=".5" stroke-width="1.5">
    <path d="M520 390 L400 300 M520 390 L640 300 M520 390 L360 470 M520 390 L680 470 M520 390 L520 220"/>
