<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 780" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5CFFB0"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g stroke="#5CFFB0" stroke-opacity=".07" stroke-width="1">
    <path d="M80 80 H900 M80 180 H900 M80 280 H900 M80 380 H900 M80 480 H900 M80 580 H900 M80 680 H900"/>
    <path d="M80 80 V700 M220 80 V700 M360 80 V700 M500 80 V700 M640 80 V700 M780 80 V700 M900 80 V700"/>
  </g>
  <g stroke="#5CFFB0" stroke-opacity=".3" stroke-width="1.5">
    <path d="M60 60 H140 M60 60 V140"/><path d="M920 60 H840 M920 60 V140"/>
    <path d="M60 720 H140 M60 720 V640"/><path d="M920 720 H840 M920 720 V640"/>
  </g>
  
  <g filter="url(#glow)">
    <rect x="180" y="220" width="200" height="340" rx="22" fill="#0f8f97" opacity=".25" stroke="#5CFFB0" stroke-width="2"/>
    <rect x="400" y="220" width="200" height="340" rx="22" fill="#1f8fc9" opacity=".22" stroke="#38bdf8" stroke-width="2"/>
    <rect x="620" y="220" width="200" height="340" rx="22" fill="#7c3aed" opacity=".2" stroke="#a78bfa" stroke-width="2"/>
  </g>
  <!-- simple person icons -->
  <g fill="#5CFFB0">
    <circle cx="280" cy="320" r="28"/>
    <path d="M230 430 C230 380,330 380,330 430 Z"/>
    <circle cx="500" cy="320" r="28" fill="#38bdf8"/>
    <path d="M450 430 C450 380,550 380,550 430 Z" fill="#38bdf8"/>
    <circle cx="720" cy="320" r="28" fill="#a78bfa"/>
    <path d="M670 430 C670 380,770 380,770 430 Z" fill="#a78bfa"/>
  </g>
  <text x="210" y="500" fill="#5CFFB0" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="800">Dental / Med</text>
  <text x="230" y="530" fill="#9aa8bc" font-family="Inter,Arial,sans-serif" font-size="16">Primary</text>
  <text x="445" y="500" fill="#38bdf8" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="800">Education</text>
  <text x="450" y="530" fill="#9aa8bc" font-family="Inter,Arial,sans-serif" font-size="16">Secondary</text>
  <text x="655" y="500" fill="#a78bfa" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="800">Aero / Def</text>
  <text x="680" y="530" fill="#9aa8bc" font-family="Inter,Arial,sans-serif" font-size="16">Tertiary</text>
  <g opacity=".9">
    <circle cx="280" cy="320" r="34" fill="none" stroke="#5CFFB0" stroke-width="2"><animate attributeName="r" values="30;38;30" dur="2.5s" repeatCount="indefinite"/><animate attributeName="opacity" values=".8;.3;.8" dur="2.5s" repeatCount="indefinite"/></circle>
  </g>

</svg>
