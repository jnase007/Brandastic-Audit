<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 780" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="gNeon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5CFFB0">
        <animate attributeName="stop-color" values="#5CFFB0;#38bdf8;#5CFFB0" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="55%" stop-color="#2dd4bf">
        <animate attributeName="stop-color" values="#2dd4bf;#5CFFB0;#2dd4bf" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#5CFFB0;#38bdf8" dur="7s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="gSoft" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f8f97" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#5CFFB0" stop-opacity=".9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- faint grid drift -->
  <g stroke="#5CFFB0" stroke-opacity=".08" stroke-width="1">
    <g>
      <path d="M80 80 H900 M80 180 H900 M80 280 H900 M80 380 H900 M80 480 H900 M80 580 H900 M80 680 H900"/>
      <path d="M80 80 V700 M200 80 V700 M320 80 V700 M440 80 V700 M560 80 V700 M680 80 V700 M800 80 V700 M900 80 V700"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -8; 0 0" dur="12s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- growth curve draws + breathes -->
  <path id="curve" filter="url(#glow)" stroke="url(#gNeon)" stroke-width="3.2" stroke-linecap="round"
        stroke-dasharray="1200" stroke-dashoffset="0"
        d="M120 620 C 220 600, 260 520, 320 480 S 420 420, 480 360 S 580 240, 660 200 S 780 160, 860 120">
    <animate attributeName="stroke-dashoffset" values="1200;0;0" keyTimes="0;0.45;1" dur="4.5s" fill="freeze"/>
    <animate attributeName="opacity" values="0.55;1;0.75;1" dur="5s" repeatCount="indefinite" begin="4s"/>
  </path>

  <!-- traveling pulse on curve -->
  <circle r="6" fill="#5CFFB0" filter="url(#glow)" opacity=".95">
    <animateMotion dur="5.5s" repeatCount="indefinite" path="M120 620 C 220 600, 260 520, 320 480 S 420 420, 480 360 S 580 240, 660 200 S 780 160, 860 120"/>
    <animate attributeName="r" values="4;8;4" dur="1.2s" repeatCount="indefinite"/>
  </circle>

  <!-- nodes pulse -->
  <g filter="url(#glow)">
    <circle cx="320" cy="480" r="7" fill="#5CFFB0">
      <animate attributeName="r" values="6;9;6" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="480" cy="360" r="7" fill="#5CFFB0">
      <animate attributeName="r" values="6;10;6" dur="2.8s" begin="0.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2.8s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="660" cy="200" r="8" fill="#38bdf8">
      <animate attributeName="r" values="7;11;7" dur="3s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="860" cy="120" r="9" fill="#5CFFB0">
      <animate attributeName="r" values="8;12;8" dur="2.6s" begin="1.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.75;1;0.75" dur="2.6s" begin="1.1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- network spokes fade -->
  <g stroke="url(#gSoft)" stroke-width="1.6" stroke-linecap="round">
    <path d="M480 360 L360 280 M480 360 L420 220 M480 360 L560 260">
      <animate attributeName="opacity" values="0.35;0.95;0.35" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M660 200 L600 120 M660 200 L720 90 M660 200 L740 180">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="4.5s" begin="0.5s" repeatCount="indefinite"/>
    </path>
    <path d="M320 480 L240 400 M320 480 L280 560 M320 480 L400 520">
      <animate attributeName="opacity" values="0.3;0.85;0.3" dur="5s" begin="1s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- satellite dots blink -->
  <g fill="#5CFFB0">
    <circle cx="360" cy="280" r="4"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="220" r="3.5"><animate attributeName="opacity" values="0.35;1;0.35" dur="2.6s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="260" r="3.5"><animate attributeName="opacity" values="0.35;1;0.35" dur="2.4s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="120" r="4"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.8s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="720" cy="90" r="3.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" begin="0.7s" repeatCount="indefinite"/></circle>
    <circle cx="740" cy="180" r="3.5"><animate attributeName="opacity" values="0.3;0.95;0.3" dur="2.7s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="240" cy="400" r="3.5"><animate attributeName="opacity" values="0.35;0.95;0.35" dur="3s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="280" cy="560" r="3"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.9s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="400" cy="520" r="3"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.3s" begin="1.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- frame corners -->
  <g stroke="#5CFFB0" stroke-opacity=".35" stroke-width="1.5">
    <path d="M60 60 H140 M60 60 V140"/>
    <path d="M920 60 H840 M920 60 V140"/>
    <path d="M60 720 H140 M60 720 V640"/>
    <path d="M920 720 H840 M920 720 V640"/>
  </g>

  <!-- bars rise -->
  <g fill="url(#gSoft)" opacity=".55">
    <rect x="150" y="620" width="28" height="0" rx="4">
      <animate attributeName="y" values="620;540;540" keyTimes="0;0.5;1" dur="3s" fill="freeze"/>
      <animate attributeName="height" values="0;80;80" keyTimes="0;0.5;1" dur="3s" fill="freeze"/>
    </rect>
    <rect x="200" y="620" width="28" height="0" rx="4">
      <animate attributeName="y" values="620;500;500" keyTimes="0;0.5;1" dur="3.2s" begin="0.15s" fill="freeze"/>
      <animate attributeName="height" values="0;120;120" keyTimes="0;0.5;1" dur="3.2s" begin="0.15s" fill="freeze"/>
    </rect>
    <rect x="250" y="620" width="28" height="0" rx="4">
      <animate attributeName="y" values="620;470;470" keyTimes="0;0.5;1" dur="3.4s" begin="0.3s" fill="freeze"/>
      <animate attributeName="height" values="0;150;150" keyTimes="0;0.5;1" dur="3.4s" begin="0.3s" fill="freeze"/>
    </rect>
    <rect x="380" y="540" width="28" height="0" rx="4" opacity=".7">
      <animate attributeName="y" values="540;420;420" keyTimes="0;0.5;1" dur="3.5s" begin="0.45s" fill="freeze"/>
      <animate attributeName="height" values="0;120;120" keyTimes="0;0.5;1" dur="3.5s" begin="0.45s" fill="freeze"/>
    </rect>
    <rect x="520" y="440" width="28" height="0" rx="4" opacity=".65">
      <animate attributeName="y" values="440;300;300" keyTimes="0;0.5;1" dur="3.6s" begin="0.6s" fill="freeze"/>
      <animate attributeName="height" values="0;140;140" keyTimes="0;0.5;1" dur="3.6s" begin="0.6s" fill="freeze"/>
    </rect>
  </g>
</svg>
