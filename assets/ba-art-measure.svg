<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 780" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5CFFB0"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g stroke="#5CFFB0" stroke-opacity=".07" stroke-width="1">
    <path d="M80 80 H900 M80 180 H900 M80 280 H900 M80 380 H900 M80 480 H900 M80 580 H900 M80 680 H900"/>
    <path d="M80 80 V700 M220 80 V700 M360 80 V700 M500 80 V700 M640 80 V700 M780 80 V700 M900 80 V700"/>
  </g>
  <g stroke="#5CFFB0" stroke-opacity=".3" stroke-width="1.5">
    <path d="M60 60 H140 M60 60 V140"/><path d="M920 60 H840 M920 60 V140"/>
    <path d="M60 720 H140 M60 720 V640"/><path d="M920 720 H840 M920 720 V640"/>
  </g>
  
  <g filter="url(#glow)">
    <rect x="180" y="200" width="280" height="160" rx="18" fill="#121a2b" stroke="#5CFFB0" stroke-width="2"/>
    <rect x="500" y="200" width="280" height="160" rx="18" fill="#121a2b" stroke="#38bdf8" stroke-width="2"/>
    <rect x="180" y="400" width="280" height="160" rx="18" fill="#121a2b" stroke="#74b816" stroke-width="2"/>
    <rect x="500" y="400" width="280" height="160" rx="18" fill="#121a2b" stroke="#a78bfa" stroke-width="2"/>
  </g>
  <g font-family="Inter,Arial,sans-serif" font-weight="800">
    <text x="210" y="270" fill="#5CFFB0" font-size="20">Pipeline</text>
    <text x="210" y="320" fill="#e8eef5" font-size="36">+ convos</text>
    <text x="530" y="270" fill="#38bdf8" font-size="20">Proposals</text>
    <text x="530" y="320" fill="#e8eef5" font-size="36">out / wk</text>
    <text x="210" y="470" fill="#74b816" font-size="20">Won / lost</text>
    <text x="210" y="520" fill="#e8eef5" font-size="32">+ reason</text>
    <text x="530" y="470" fill="#a78bfa" font-size="20">Recurring</text>
    <text x="530" y="520" fill="#e8eef5" font-size="32">→ $160K</text>
  </g>
  <circle cx="430" cy="280" r="6" fill="#5CFFB0"><animate attributeName="opacity" values="1;.2;1" dur="1.5s" repeatCount="indefinite"/></circle>

</svg>
