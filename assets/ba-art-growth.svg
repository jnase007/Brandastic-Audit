<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 780" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5CFFB0"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g stroke="#5CFFB0" stroke-opacity=".07" stroke-width="1">
    <path d="M80 80 H900 M80 180 H900 M80 280 H900 M80 380 H900 M80 480 H900 M80 580 H900 M80 680 H900"/>
    <path d="M80 80 V700 M220 80 V700 M360 80 V700 M500 80 V700 M640 80 V700 M780 80 V700 M900 80 V700"/>
  </g>
  <g stroke="#5CFFB0" stroke-opacity=".3" stroke-width="1.5">
    <path d="M60 60 H140 M60 60 V140"/><path d="M920 60 H840 M920 60 V140"/>
    <path d="M60 720 H140 M60 720 V640"/><path d="M920 720 H840 M920 720 V640"/>
  </g>
  
  <path filter="url(#glow)" stroke="url(#g)" stroke-width="3.5" stroke-linecap="round" fill="none"
        d="M140 600 C 260 560, 300 480, 380 420 S 520 300, 620 240 S 760 160, 860 120" stroke-dasharray="1100">
    <animate attributeName="stroke-dashoffset" from="1100" to="0" dur="3.5s" fill="freeze"/>
  </path>
  <circle r="7" fill="#5CFFB0" filter="url(#glow)">
    <animateMotion dur="5s" repeatCount="indefinite" path="M140 600 C 260 560, 300 480, 380 420 S 520 300, 620 240 S 760 160, 860 120"/>
  </circle>
  <g fill="#5CFFB0" filter="url(#glow)">
    <circle cx="380" cy="420" r="8"/><circle cx="620" cy="240" r="9"/><circle cx="860" cy="120" r="10"/>
  </g>
  <text x="200" y="680" fill="#9aa8bc" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="600">Search · referrals · proof · booked work</text>

</svg>
