    <path d="M60 720 H140 M60 720 V640"/><path d="M920 720 H840 M920 720 V640"/>
  </g>
  
  <g filter="url(#glow)" fill="url(#g)" opacity=".85">
    <path d="M200 180 H780 L700 280 H280 Z" opacity=".95"/>
    <path d="M250 300 H730 L650 400 H330 Z" opacity=".8"/>
    <path d="M300 420 H680 L600 520 H380 Z" opacity=".65"/>
    <path d="M360 540 H620 L560 640 H420 Z" opacity=".5"/>
  </g>
  <g fill="#0d1b2a" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="800">
