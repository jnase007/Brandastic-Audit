<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Brandastic 2027 &middot; Growth strategy</title>
<meta name="robots" content="noindex,nofollow"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>

:root{
 --bg:#f4f7fa; --slide:#ffffff; --ink:#15202b; --muted:#5b6b7c; --line:rgba(21,32,43,.12);
 --teal:#0644ed; --accent:#3b6cf5; --purple:#001F40;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}
body{min-height:100vh}
.deck{max-width:1180px;margin:0 auto;padding:1rem 1rem 3rem}
.toolbar{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin-bottom:1rem;position:sticky;top:.5rem;z-index:30;background:rgba(244,247,250,.92);backdrop-filter:blur(8px);padding:.4rem 0}
.btn{border:0;cursor:pointer;border-radius:10px;font-weight:700;font-size:.8rem;padding:.5rem .85rem;text-decoration:none;display:inline-flex;align-items:center}
.btn-p{background:linear-gradient(135deg,var(--accent),var(--purple));color:#ffffff}
.btn-g{background:#ffffff;border:1px solid var(--line);color:var(--ink)}
.hint{color:var(--muted);font-size:.75rem}
.slide{background:var(--slide);border:1px solid var(--line);border-radius:18px;padding:2rem 2.35rem 1.6rem;margin:0 0 1rem;min-height:620px;position:relative;overflow:hidden;box-shadow:0 12px 36px rgba(21,32,43,.08)}
.slide::before{content:"";position:absolute;right:-100px;top:-100px;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,rgba(31,143,201,.10),transparent 70%);pointer-events:none}
.slide-inner{position:relative;z-index:1;display:flex;flex-direction:column;min-height:540px;padding-bottom:0}
.slide-inner > .footer-bar{position:static;margin-top:auto;padding-top:1.1rem;flex-shrink:0;background:transparent}
.kicker{font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);margin-bottom:1rem}
.h1{font-size:clamp(2rem,4.2vw,3.1rem);font-weight:700;letter-spacing:-.03em;line-height:1.08;margin-bottom:.75rem;color:var(--ink)}
.h2{font-size:clamp(1.5rem,3vw,2.2rem);font-weight:700;letter-spacing:-.02em;margin-bottom:1rem;color:var(--ink)}
.lede{font-size:1.06rem;color:var(--muted);max-width:42rem;line-height:1.6}
.footer-bar{position:static;display:flex;justify-content:space-between;align-items:center;font-size:.7rem;color:rgba(21,32,43,.42);letter-spacing:.04em;margin-top:1rem;padding-top:.85rem;border-top:1px solid rgba(21,32,43,.06)}
.num{font-weight:600}
.divider-slide{display:flex;flex-direction:column;justify-content:center;min-height:560px}
.phase{color:var(--accent);font-size:.82rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin-bottom:.55rem}
.phase-p{color:var(--purple)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
.card{background:#f7fafc;border:1px solid var(--line);border-radius:14px;padding:1.05rem 1.1rem}
.card h3{font-size:.98rem;font-weight:700;margin-bottom:.4rem;color:var(--ink)}
.card p,.card li{font-size:.88rem;color:var(--muted);line-height:1.55}
.card ul{padding-left:1.05rem;margin:.25rem 0}
.card li{margin:.2rem 0}
.card strong{color:var(--ink)}
.big{font-size:1.02rem;color:var(--ink);font-weight:600;line-height:1.55;max-width:44rem}
.pill{display:inline-block;font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--teal);background:rgba(15,143,151,.10);border:1px solid rgba(15,143,151,.28);padding:.26rem .5rem;border-radius:999px;margin:0 .2rem .3rem 0}
.table{width:100%;border-collapse:collapse;font-size:.78rem;margin-top:.35rem;table-layout:fixed}
.table th,.table td{border:1px solid var(--line);padding:.36rem .42rem;text-align:left;vertical-align:top;word-wrap:break-word;overflow-wrap:anywhere}
.table th{background:#eef3f7;color:var(--ink);font-weight:700}
.table td{color:var(--muted)}
.table.icp-people col.c1{width:22%}
.table.icp-people col.c2{width:40%}
.table.icp-people col.c3{width:38%}
.table.icp-firms col.c1{width:36%}
.table.icp-firms col.c2{width:28%}
.table.icp-firms col.c3{width:24%}
.table.icp-firms col.c4{width:12%}
.icp-sub{font-size:.68rem;color:var(--muted);margin-top:.1rem;line-height:1.35}
.icp-name a{color:var(--ink);text-decoration:none;font-weight:700}
.icp-name a:hover{color:var(--teal)}
.quote{border-left:3px solid var(--teal);padding:.12rem 0 .12rem .95rem;margin:.9rem 0;font-size:1.08rem;font-weight:600;color:var(--ink);line-height:1.45;max-width:44rem}
.msg{background:#f3f7fa;border:1px solid var(--line);border-radius:12px;padding:.95rem 1.05rem;margin:.45rem 0;font-size:.84rem;line-height:1.55;color:#334556;white-space:pre-wrap}
.msg .lbl{font-size:.64rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--teal);margin-bottom:.32rem}
.msg .subj{color:var(--ink);font-weight:700;margin-bottom:.35rem}
.flow{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;margin:.9rem 0}
.flow .step{background:#f3f7fa;border:1px solid var(--line);border-radius:12px;padding:.6rem .8rem;font-weight:700;font-size:.86rem;color:var(--ink)}
.flow .arrow{color:var(--teal);font-weight:800}
.cal-week{display:grid;grid-template-columns:88px 1fr;gap:.65rem;padding:.6rem 0;border-bottom:1px solid var(--line)}
.cal-week:last-child{border-bottom:0}
.cal-week b{color:var(--teal);font-size:.82rem}
.cal-week span{color:var(--muted);font-size:.84rem;line-height:1.5}
.stat{font-size:clamp(1.6rem,3.3vw,2.45rem);font-weight:800;letter-spacing:-.03em;color:var(--ink);line-height:1.1}
.stat-lbl{font-size:.78rem;color:var(--muted);margin-top:.28rem;line-height:1.4}
.toc-list{margin-top:1.2rem;display:grid;gap:.58rem;max-width:40rem;font-size:1rem;font-weight:600;color:var(--ink)}
.toc-list span{color:var(--muted);font-weight:500}
.persona-hero{display:grid;grid-template-columns:190px 1fr;gap:1.15rem;align-items:start}
.persona-photo{display:block;width:180px;height:220px;border-radius:14px;object-fit:cover;object-position:center 12%;border:1px solid var(--line);background:#e8eef3}
.persona-photo-ph{width:190px;height:250px;border-radius:16px;border:1px solid var(--line);background:linear-gradient(160deg,#eef3f7,#e2eaf1 55%,#d9e6ef);display:flex;align-items:flex-end;padding:1rem;color:var(--muted);font-size:.76rem;font-weight:600}
.persona-name{font-size:1.5rem;font-weight:800;letter-spacing:-.02em;margin:.12rem 0 .18rem;color:var(--ink)}
.persona-role{font-size:.84rem;color:var(--teal);font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin-bottom:.5rem}
.persona-quote{font-size:1.02rem;font-style:italic;color:#3a4a5a;line-height:1.45;margin:.35rem 0 .9rem;max-width:34rem}
.persona-meta{font-size:.82rem;color:var(--muted);line-height:1.55;margin-bottom:.3rem}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
.trio{align-items:stretch}.trio .card{display:flex;flex-direction:column}.trio .persona-card img,.persona-photo .persona-card img,.persona-photo .persona-card img,.persona-photo img,.persona-photo-sm{display:block;width:100%;height:200px;object-fit:cover;object-position:center 12%;border-radius:12px;margin:0 0 .65rem;border:1px solid var(--line);background:#e8eef3;flex:0 0 auto}
.persona-photo-sm-ph{width:100%;height:150px;border-radius:12px;margin-bottom:.7rem;border:1px solid var(--line);background:linear-gradient(160deg,#eef3f7,#e2eaf1);display:flex;align-items:flex-end;padding:.7rem;font-size:.7rem;color:var(--muted);font-weight:600}
.persona-board{display:grid;grid-template-columns:repeat(3,1fr);gap:.85rem;align-items:start}
.persona-board .card{padding:.75rem .8rem .85rem;min-height:0}
.persona-board .persona-card img,.icp-face img,.photo .persona-card img,.icp-face .persona-card img,.icp-face img{display:block;width:100%;height:155px;object-fit:cover;object-position:center 12%;border-radius:12px;margin:0 0 .45rem;border:1px solid var(--line);background:#e8eef3}
.persona-board .persona-name{font-size:1.05rem;margin:.1rem 0 .2rem}
.persona-board .persona-role{font-size:.68rem;margin-bottom:.35rem;letter-spacing:.05em}
.persona-board .persona-quote{font-size:.78rem;font-style:italic;color:#3a4a5a;line-height:1.3;margin:0 0 .4rem;min-height:0}
.persona-board .persona-meta{font-size:.74rem;line-height:1.4;margin:0 0 .55rem}
.persona-board .mini{display:grid;gap:.35rem}
.persona-board .mini h4{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--teal);margin:0}
.persona-board .mini ul{margin:0;padding-left:1rem}
.persona-board .mini li{font-size:.72rem;color:var(--muted);line-height:1.35;margin:.08rem 0}
@media print{
 .persona-board .persona-card .persona-card .persona-card img{height:140px}
 .persona-board .persona-quote{font-size:.78rem;min-height:0}
 .persona-board .mini li{font-size:.68rem}
}
.forecast-svg{display:block;width:100%;max-height:280px;border:1px solid var(--line);border-radius:12px;background:#f7fafc}
.check li{list-style:none;padding-left:0;margin:.35rem 0}
.check li::before{content:"→ ";color:var(--teal);font-weight:800}
@media(max-width:860px){
 .slide{padding:1.4rem 1.1rem 3rem;min-height:auto}
 .grid2,.grid3,.trio,.persona-hero{grid-template-columns:1fr}
 .persona-photo,.persona-photo-ph{width:100%;height:220px}
 .footer-bar{position:static!important;margin-top:.85rem;padding-top:.55rem;border-top:1px solid rgba(21,32,43,.08);color:rgba(21,32,43,.45)}
 .cal-week{grid-template-columns:1fr}
}
@page{size:letter landscape;margin:.38in}
@media print{
 .toolbar{display:none!important}
 html,body{background:#ffffff!important;color:var(--ink)}
 .deck{max-width:none;padding:0;margin:0}
 .slide{
 background:#ffffff!important;
 break-after:page;page-break-after:always;
 box-shadow:none;border:0;border-radius:0;
 min-height:0;height:auto;margin:0;padding:.8rem .95rem 1.15rem;
 overflow:visible
 }
 .slide:last-child{break-after:auto;page-break-after:auto}
 .slide::before{display:none}
 .divider-slide{min-height:0}
 .footer-bar{position:static;margin-top:.7rem;color:rgba(21,32,43,.45)}
 .card,.msg,.flow .step,.table th{background:#f7fafc!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 a{color:var(--teal)!important;text-decoration:none}
 .h1{font-size:1.85rem}
 .h2{font-size:1.35rem;margin-bottom:.45rem}
 .lede{font-size:.9rem}
 .table{font-size:.7rem}
 .table th,.table td{padding:.26rem .3rem}
 .persona-photo,.persona-photo-ph{width:150px;height:185px;object-position:center 12%}
 .persona-hero{grid-template-columns:160px 1fr;gap:.85rem}
 .trio .persona-card img,.persona-photo .persona-card img,.persona-photo-sm{height:170px;object-position:center 12%}
 .grid3{gap:.65rem}
 .card{padding:.7rem .75rem}
 .card p,.card li{font-size:.78rem}
 .persona-quote{font-size:.95rem}
}
.comp-bubbles{display:block;width:100%;border:1px solid var(--line);border-radius:14px;background:#f7fafc}
.comp-note{font-size:.74rem;color:var(--muted);line-height:1.35;margin-top:.45rem}

.li-ad-wrap{display:grid;grid-template-columns:1.15fr .85fr;gap:.85rem;align-items:start}
.li-ad-mock{background:#fff;border:1px solid #e3e5e8;border-radius:12px;padding:1rem 1.05rem 1.05rem;box-shadow:0 8px 24px rgba(21,32,43,.06);font-family:Inter,system-ui,sans-serif}
.li-ad-mock .ad-top{display:flex;align-items:center;gap:.55rem;margin-bottom:.7rem}
.li-ad-mock .ad-logo{width:28px;height:28px;border-radius:6px;background:linear-gradient(135deg,#0f8f97,#1f8fc9);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:.7rem}
.li-ad-mock .ad-meta{line-height:1.15}
.li-ad-mock .ad-meta strong{font-size:.82rem;color:#15202b}
.li-ad-mock .ad-meta span{font-size:.68rem;color:#6b7785}
.li-ad-mock .ad-person{display:flex;align-items:center;gap:.45rem;margin:.15rem 0 .55rem;font-size:.78rem;font-weight:700;color:#15202b}
.li-ad-mock .ad-avatar{width:34px;height:34px;border-radius:50%;background:#d9e6ef;border:1px solid #c5d3de}
.li-ad-mock .ad-body{font-size:.84rem;color:#1f2a36;line-height:1.45;white-space:pre-wrap}
.li-ad-mock .ad-btns{display:flex;flex-direction:column;gap:.4rem;margin-top:.75rem}
.li-ad-mock .ad-btn{border:1px solid #c9d2dc;border-radius:18px;padding:.45rem .7rem;text-align:center;font-size:.78rem;color:#3a4a5a;background:#f7f9fb}
.li-ad-mock .ad-btn.primary{border-color:#0f8f97;color:#0f8f97;font-weight:700}
.li-ad-side{font-size:.78rem;color:var(--muted);line-height:1.45}
.li-ad-side h3{margin:0 0 .35rem}
@media print{.li-ad-wrap{grid-template-columns:1.1fr .9fr}}


.title-brand{display:flex;flex-direction:column;align-items:flex-start;gap:.85rem;margin-bottom:1.1rem}
.title-brand img{height:52px;width:auto;display:block}
.title-tagline{font-size:1.05rem;font-weight:600;color:var(--ink);line-height:1.35;max-width:36rem}
.title-tagline span{color:var(--teal);font-weight:800}
@media print{.title-brand img{height:44px}}


.channel-toc{display:grid;grid-template-columns:repeat(4,1fr);gap:.65rem;margin-top:.85rem}
.channel-toc .card{text-align:center;padding:1rem .6rem;border:1px solid var(--line)}
.channel-toc .card strong{display:block;font-size:1.05rem;color:var(--teal);margin-bottom:.25rem}
.channel-toc .card span{font-size:.78rem;color:var(--muted);line-height:1.35}

/* Title slide: main story centered; brand lockup small bottom-left */
.slide#title .slide-inner,
.slide-inner.title-slide{
 min-height:560px;
 display:flex;
 flex-direction:column;
 justify-content:center;
 align-items:flex-start;
 position:relative;
 padding-bottom:4.5rem;
}
.slide#title .title-main{max-width:34rem}
.slide#title .title-main .h1{font-size:2.75rem;line-height:1.05;margin:0}
.slide#title .title-main .kicker{margin-bottom:.55rem}
.slide#title .title-main .lede{margin-top:.85rem;max-width:28rem}
.slide#title .title-brand{
 position:absolute;
 left:0; bottom:0;
 margin:0;
 gap:.28rem;
 max-width:22rem;
}
.slide#title .title-brand img{height:28px;width:auto;opacity:.95}
.slide#title .title-tagline{
 font-size:.78rem;
 font-weight:600;
 color:var(--muted);
 line-height:1.3;
 max-width:22rem;
 letter-spacing:0;
}
.slide#title .footer-bar{display:none} /* brand lockup replaces footer on title */
@media print{
 .slide#title .slide-inner,.slide-inner.title-slide{min-height:0;padding-bottom:3.2rem}
 .slide#title .title-brand img{height:24px}
}


.slide#close .title-brand img{height:32px}
.slide#close .title-tagline{font-size:.85rem;font-weight:600;color:var(--muted);max-width:28rem}

/* Brandastic-style visual strategy blocks + campaign color sets */
:root{
 --camp-li:#0f8f97;
 --camp-email:#1f8fc9;
 --camp-social:#7eb832;
 --camp-seo:#9b1fd6;
 --camp-lender:#2b6cb0;
 --camp-dev:#c05621;
}
.camp-pill{display:inline-flex;align-items:center;gap:.35rem;border-radius:999px;padding:.28rem .7rem;font-weight:800;font-size:.78rem;color:#fff}
.camp-pill.li{background:var(--camp-li)}
.camp-pill.email{background:var(--camp-email)}
.camp-pill.social{background:var(--camp-social);color:#143018}
.camp-pill.seo{background:var(--camp-seo)}
.camp-pill.lender{background:var(--camp-lender)}
.camp-key{display:flex;flex-wrap:wrap;gap:.45rem;margin:.6rem 0 1rem}
.ba-sw{display:grid;grid-template-columns:1fr 1.15fr;gap:1rem;margin-top:.75rem;align-items:stretch}
.ba-sw .panel{border-radius:18px;border:1px solid var(--line);overflow:hidden;background:#fff;box-shadow:0 8px 24px rgba(21,32,43,.06)}
.ba-sw .panel .hd{padding:.75rem 1.05rem;font-weight:800;color:#fff;font-size:.95rem}
.ba-sw .panel.strengths .hd{background:#1a2330}
.ba-sw .panel.opps .hd{background:#1a2330}
.ba-sw .panel .bd{padding:1rem 1.1rem 1.15rem}
.ba-sw ul{margin:0;padding-left:1.05rem;color:var(--ink);font-size:.9rem;line-height:1.45}
.ba-sw li{margin:.35rem 0}
.ba-sw .opp-block{margin:0 0 .85rem}
.ba-sw .opp-block:last-child{margin:0}
.ba-sw .opp-block strong{display:block;font-size:.72rem;letter-spacing:.04em;text-transform:uppercase;color:var(--camp-li);margin-bottom:.25rem}
.measure-grid{display:grid;grid-template-columns:220px 1fr;gap:1.1rem;margin-top:.7rem}
.measure-side{background:#e8edf2;border-radius:18px;padding:1.1rem 1.15rem}
.measure-side h3{font-size:.95rem;margin:0 0 .55rem}
.measure-side ul{margin:0;padding-left:1.05rem;font-size:.88rem;line-height:1.4}
.measure-rows{display:flex;flex-direction:column}
.measure-row{display:grid;grid-template-columns:200px 1fr;gap:1rem;align-items:start;padding:.75rem 0;border-bottom:1px solid var(--line)}
.measure-row:last-child{border-bottom:0}
.measure-row .tag{border-radius:999px;padding:.45rem .85rem;font-weight:800;font-size:.82rem;color:#fff;text-align:center}
.measure-row .tag.a{background:#2eb7d4}
.measure-row .tag.b{background:#2f6bff}
.measure-row .tag.c{background:#b7e04a;color:#1a2a10}
.measure-row .tag.d{background:#c9e8f5;color:#1a4a66}
.measure-row .tag.e{background:#fff;color:#2f6bff;border:2px solid #c9d8f0}
.measure-row ul{display:grid;grid-template-columns:1fr 1fr;gap:.15rem .8rem;margin:0;padding-left:1rem;font-size:.84rem;color:#1f2a36}
.days90{display:grid;grid-template-columns:repeat(3,1fr);gap:.85rem;margin-top:.85rem}
.days90 .col{border-radius:18px;padding:1rem .95rem 1.05rem;min-height:400px}
.days90 .col h3{margin:0 0 .85rem;font-size:.95rem;color:#fff;background:rgba(0,0,0,.12);border-radius:12px;padding:.55rem .7rem;text-align:center}
.days90 .col.p1{background:linear-gradient(180deg,#2f6bff,#4b7fff);color:#fff}
.days90 .col.p2{background:linear-gradient(180deg,#3aa8e8,#5ec0f0);color:#fff}
.days90 .col.p3{background:linear-gradient(180deg,#b7e04a,#c8ea6e);color:#1a2a10}
.days90 .col.p3 h3{color:#1a2a10;background:rgba(255,255,255,.35)}
.days90 .item{display:grid;grid-template-columns:28px 1fr;gap:.55rem;margin:0 0 .7rem;align-items:start}
.days90 .ico{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:800}
.days90 .item b{display:block;font-size:.82rem;letter-spacing:.02em}
.days90 .item span{display:block;font-size:.78rem;opacity:.92;line-height:1.3;font-weight:500}
.roadmap{margin-top:.7rem}
.roadmap-head{display:grid;grid-template-columns:150px repeat(12,1fr);gap:0;font-size:.6rem;font-weight:700;color:var(--muted);text-align:center;margin-bottom:.35rem}
.roadmap-row{display:grid;grid-template-columns:150px 1fr;gap:.5rem;align-items:center;margin:.38rem 0}
.roadmap-row .lab{font-size:.72rem;font-weight:700;color:var(--muted)}
.roadmap-track{position:relative;height:28px;background:rgba(21,32,43,.04);border-radius:8px;overflow:hidden}
.roadmap-track::before{content:"";position:absolute;inset:0;background-image:repeating-linear-gradient(90deg,transparent,transparent calc(100%/12 - 1px),rgba(0,0,0,.06) calc(100%/12 - 1px),rgba(0,0,0,.06) calc(100%/12))}
.bar{position:absolute;top:4px;height:20px;border-radius:999px;font-size:.58rem;font-weight:800;color:#fff;display:flex;align-items:center;padding:0 .5rem;white-space:nowrap;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.bar.g{background:#2f6bff}
.bar.s{background:#3aa8e8}
.bar.o{background:#b7e04a;color:#1a2a10}
.bar.e{background:#a8b4f0;color:#1a2038}
.bar.i{background:#d7eef8;color:#1a4a66}
.roadmap-legend{display:flex;flex-wrap:wrap;gap:.65rem;margin-top:.85rem;font-size:.72rem;font-weight:700;color:var(--muted)}
.roadmap-legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:.3rem}
.ad-spec-dark-wrap{background:#171b22;color:#e8eef5;border-radius:18px;overflow:hidden;min-height:540px}

/* ===== Full deck: black section openers + campaign colors (no purple Canva boxes) ===== */
:root{
 --camp-li:#3B9DD9;
 --camp-li-soft:#E3F3FB;
 --camp-li-ink:#0c4a6e;
 --camp-email:#9BA3E8;
 --camp-email-soft:#EEF0FC;
 --camp-email-ink:#3730a3;
 --camp-social:#A8D93A;
 --camp-social-soft:#F3FBE3;
 --camp-social-ink:#3f6212;
 --camp-seo:#7DD3FC;
 --camp-seo-bar:#D7EEF8;
 --camp-seo-soft:#F0F9FF;
 --camp-seo-ink:#0369a1;
 --camp-pilot:#2F6BFF;
 --camp-dev:#c05621;
 --camp-lender:#64748b;
 --sec-dark:#0f1419;
}
.camp-nav{
 display:flex;flex-wrap:wrap;gap:.35rem;align-items:center;
 position:sticky;top:3rem;z-index:35;
 background:rgba(244,247,250,.95);backdrop-filter:blur(8px);
 padding:.3rem 0 .55rem;margin:0 0 .75rem;border-bottom:1px solid var(--line);
}
.camp-nav .lab{font-size:.65rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-right:.2rem}
.camp-nav a{text-decoration:none;font-size:.7rem;font-weight:800;border-radius:999px;padding:.3rem .65rem;color:#fff}
.camp-nav a.li{background:var(--camp-li)}
.camp-nav a.email{background:var(--camp-email);color:#1e1b4b}
.camp-nav a.social{background:var(--camp-social);color:#143018}
.camp-nav a.seo{background:var(--camp-seo);color:var(--camp-seo-ink)}
.camp-nav a.ads{background:linear-gradient(135deg,var(--camp-li),var(--camp-social));color:#0f172a}
.camp-nav a.plan{background:#334155;color:#fff}
.camp-nav a.budget{background:#0f1419;color:#fff}

/* Black section openers — NO purple box */
.slide.section-dark,
.slide-inner.divider-slide{
 background:var(--sec-dark)!important;
 color:#fff!important;
 border-color:#1f2937!important;
 box-shadow:none!important;
 min-height:520px;
 display:flex;flex-direction:column;justify-content:center;align-items:flex-start;
 padding:2.2rem 2.4rem!important;
}
.slide.section-dark .h1,
.slide-inner.divider-slide .h1{
 color:#fff!important;font-size:3rem;line-height:1.05;border:0!important;padding:0!important;margin:0;
 box-shadow:none!important;outline:none!important;
}
.slide.section-dark .phase,
.slide-inner.divider-slide .phase{color:rgba(255,255,255,.55)!important;font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:.75rem;margin-bottom:.75rem}
.slide.section-dark .lede,
.slide.section-dark p,
.slide-inner.divider-slide .lede,
.slide-inner.divider-slide p{color:rgba(255,255,255,.72)!important}
.slide.section-dark .footer-bar,
.slide-inner.divider-slide .footer-bar{border-top-color:rgba(255,255,255,.12)!important;color:rgba(255,255,255,.45)!important;width:100%;margin-top:auto;padding-top:1.2rem}

.slide-inner.divider-slide .sec-plain{border:0!important;padding:0!important;margin:0!important;background:transparent!important}

/* Campaign rails */
.slide[data-camp="linkedin"] .slide-inner{border-left:7px solid var(--camp-li);padding-left:calc(2.35rem - 2px)}
.slide[data-camp="email"] .slide-inner{border-left:7px solid var(--camp-email);padding-left:calc(2.35rem - 2px)}
.slide[data-camp="social"] .slide-inner{border-left:7px solid var(--camp-social);padding-left:calc(2.35rem - 2px)}
