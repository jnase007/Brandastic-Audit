.passcode-overlay .lock-brand { position:absolute; bottom:2rem; font-size:0.75rem; color:var(--text-muted); letter-spacing:0.15em; }
@keyframes shake {

  25% { transform: translateX(-8px); }
  50% { transform: translateX(8px); }
  75% { transform: translateX(-4px); }

@media(max-width:768px) {

const MONTH_FILTERS = ["All", "Sep 2026", "Aug 2026", "Jul 2026", "Jun 2026"];

function getPreferredTheme(){
  const s=localStorage.getItem('brandastic-theme');
  if(s)return s;
  return window.matchMedia('(prefers-color-scheme:light)').matches?'light':'dark';
}
function applyTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  localStorage.setItem('brandastic-theme',t);
  const dark=document.querySelector('.theme-icon-dark');
  const light=document.querySelector('.theme-icon-light');
  if(dark) dark.style.display=t==='dark'?'block':'none';
  if(light) light.style.display=t==='light'?'block':'none';
}
function toggleTheme(){
  const c=document.documentElement.getAttribute('data-theme');
  applyTheme(c==='dark'?'light':'dark');
}
applyTheme(getPreferredTheme());

const grid=document.getElementById('cardsGrid');
const filtersEl=document.getElementById('filters');
const search=document.getElementById('searchBar');
const countEl=document.getElementById('searchCount');
let monthFilter='All';

MONTH_FILTERS.forEach((label,i)=>{
  const btn=document.createElement('button');
  btn.className='filter-chip'+(i===0?' active':'');
  btn.type='button';
  btn.textContent=label;
  btn.addEventListener('click',()=>{
    monthFilter=label;
    document.querySelectorAll('.filter-chip').forEach(c=>c.classList.toggle('active',c===btn));
    render();
  });
  filtersEl.appendChild(btn);
});

function cardMatches(report,q,month){
  const hay=[report.name,report.host,report.desc,report.latest.label,...report.months.map(m=>m.label)].join(' ').toLowerCase();
  if(q && !hay.includes(q)) return false;
  if(month!=='All' && !report.months.some(m=>m.label===month)) return false;
  return true;
}

function render(){
  const q=search.value.toLowerCase().trim();
  const visible=REPORTS.filter(r=>cardMatches(r,q,monthFilter));
  grid.innerHTML=visible.map(r=>{
    const months=[r.latest,...(r.extra?[r.extra]:[]),...r.months].map((m,i)=>
      `<a class="month-link${i===0?' latest':''}" href="${m.href}">${m.label}</a>`
    ).join('');
    return `<article class="report-card">
      <div class="card-kicker">Monthly SEO Report</div>
      <div class="card-title">${r.name}</div>
      <a class="card-url" href="${r.url}" target="_blank" rel="noopener">${r.host} ↗</a>
      <p class="card-desc">${r.desc}</p>
      <div class="months">${months}</div>
    </article>`;
  }).join('') + `<div class="no-results" id="noResults">No reports match your filters.</div>`;
  const none=document.getElementById('noResults');
  none.style.display=visible.length? 'none':'block';
  countEl.textContent=visible.length+' of '+REPORTS.length+' clients';
}

search.addEventListener('input',render);

  document.body.style.overflow='hidden';
  const input=document.getElementById('passcodeInput');
  const error=document.getElementById('passcodeError');
  if(!input) return;
  input.addEventListener('input',function(){
    error.textContent='';
    input.classList.remove('shake');
    if(this.value.length===4){
      if(this.value===CODE){
        sessionStorage.setItem(STORAGE_KEY,'true');
        const ov=document.getElementById('passcodeOverlay');
        ov.style.transition='opacity 0.3s';
        ov.style.opacity='0';
        setTimeout(()=>{ ov.remove(); document.body.style.overflow=''; },300);
      } else {
        input.classList.add('shake');
        error.textContent='Incorrect code';
        setTimeout(()=>{ this.value=''; input.classList.remove('shake'); },500);
      }
    }
  });
  document.getElementById('passcodeOverlay').addEventListener('click',()=>input.focus());
})();
</script>
</body>
</html>
